<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>배움도우미 챗봇</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f3f6fb;
      color: #202b3c;
      font-family: Arial, "Malgun Gothic", sans-serif;
      font-size: 18px;
    }

    .page-content {
      display: grid;
      min-height: 100vh;
      place-items: center;
      padding: 24px;
      text-align: center;
    }

    .page-content h1 {
      font-size: clamp(28px, 6vw, 42px);
    }

    .page-content p {
      line-height: 1.6;
    }

    .open-chat-button {
      padding: 16px 24px;
      border: 0;
      border-radius: 14px;
      background: #2457a6;
      color: #ffffff;
      font: inherit;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 5px 16px rgba(29, 48, 76, 0.2);
    }

    .open-chat-button:hover {
      background: #193f7c;
    }

    .open-chat-button:focus-visible,
    .close-button:focus-visible,
    .send-button:focus-visible {
      outline: 3px solid #91baff;
      outline-offset: 3px;
    }

    .chat-overlay {
      position: fixed;
      z-index: 1000;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(13, 27, 45, 0.58);
    }

    .chat-overlay[hidden] {
      display: none;
    }

    .chat-container {
      display: flex;
      flex-direction: column;
      width: min(100%, 760px);
      height: min(850px, calc(100vh - 48px));
      min-height: 520px;
      overflow: hidden;
      background: #ffffff;
      border: 1px solid #dce3ed;
      border-radius: 20px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.24);
    }

    .chat-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      padding: 20px 24px;
      background: #2457a6;
      color: #ffffff;
    }

    .chat-header h2 {
      margin: 0;
      font-size: 28px;
    }

    .chat-header p {
      margin: 8px 0 0;
      font-size: 17px;
    }

    .close-button {
      flex: 0 0 auto;
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.18);
      color: #ffffff;
      font-size: 28px;
      line-height: 1;
      cursor: pointer;
    }

    .close-button:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .api-key-area {
      padding: 16px 20px;
      background: #eef4fc;
      border-bottom: 1px solid #dce3ed;
    }

    .api-key-area label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    .api-key-input {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid #aab8cb;
      border-radius: 10px;
      font: inherit;
    }

    .api-key-input:focus,
    .chat-input:focus {
      outline: 3px solid #b9d6ff;
      border-color: #2457a6;
    }

    .warning {
      margin: 8px 0 0;
      color: #7a3b00;
      font-size: 15px;
      line-height: 1.5;
    }

    .chat-messages {
      display: flex;
      flex: 1;
      flex-direction: column;
      gap: 16px;
      padding: 24px;
      overflow-y: auto;
      background: #f8faff;
    }

    .message {
      max-width: min(82%, 520px);
      padding: 14px 18px;
      border-radius: 18px;
      line-height: 1.6;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .message.bot {
      align-self: flex-start;
      background: #e7edf7;
      border-bottom-left-radius: 5px;
    }

    .message.user {
      align-self: flex-end;
      background: #d9eaff;
      border-bottom-right-radius: 5px;
    }

    .chat-form {
      display: flex;
      gap: 12px;
      padding: 18px;
      border-top: 1px solid #dce3ed;
      background: #ffffff;
    }

    .chat-input {
      flex: 1;
      min-width: 0;
      padding: 14px 16px;
      border: 2px solid #aab8cb;
      border-radius: 12px;
      font: inherit;
    }

    .send-button {
      padding: 12px 22px;
      border: 0;
      border-radius: 12px;
      background: #2457a6;
      color: #ffffff;
      font: inherit;
      font-weight: bold;
      cursor: pointer;
    }

    .send-button:hover {
      background: #193f7c;
    }

    .send-button:disabled {
      background: #8294ae;
      cursor: wait;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* portfolio.html 안에 표시될 때는 bot.html 자체가 팝업 안을 채웁니다. */
    body.embed-mode .page-content {
      display: none;
    }

    body.embed-mode .chat-overlay {
      padding: 0;
      background: transparent;
    }

    body.embed-mode .chat-container {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      min-height: 100vh;
      min-height: 100dvh;
      border: 0;
      border-radius: 0;
      box-shadow: none;
    }

    body.embed-mode .close-button {
      display: none;
    }

    @media (max-width: 520px) {
      .chat-overlay {
        padding: 0;
      }

      .chat-container {
        width: 100%;
        height: 100vh;
        height: 100dvh;
        min-height: 100vh;
        min-height: 100dvh;
        border: 0;
        border-radius: 0;
      }

      .chat-header {
        padding: 16px;
      }

      .chat-header h2 {
        font-size: 25px;
      }

      .api-key-area {
        padding: 14px;
      }

      .chat-messages {
        padding: 18px 14px;
      }

      .message {
        max-width: 90%;
      }

      .chat-form {
        gap: 8px;
        padding: 12px;
      }

      .send-button {
        padding: 12px 16px;
      }
    }
  </style>
</head>

<body>
  <main class="page-content">
    <div>
      <h1>배움도우미</h1>
      <p>직업훈련과 학교 안내가 필요하면 챗봇을 열어 주세요.</p>
      <button class="open-chat-button" id="openChatButton" type="button">
        배움도우미 열기
      </button>
    </div>
  </main>

  <div class="chat-overlay" id="chatOverlay" hidden>
    <main
      class="chat-container"
      role="dialog"
      aria-modal="true"
      aria-labelledby="chatTitle"
      aria-describedby="chatDescription"
    >
      <header class="chat-header">
        <div>
          <h2 id="chatTitle">배움도우미</h2>
          <p id="chatDescription">궁금한 내용을 편하게 입력해 주세요.</p>
        </div>
        <button
          class="close-button"
          id="closeChatButton"
          type="button"
          aria-label="챗봇 닫기"
          title="닫기"
        >×</button>
      </header>

      <section class="api-key-area" aria-label="API 키 설정">
        <label for="apiKeyInput">OpenRouter API 키</label>
        <input
          class="api-key-input"
          id="apiKeyInput"
          type="password"
          placeholder="API 키를 입력해 주세요"
          autocomplete="off"
        >
        <p class="warning">
          연습용 화면입니다. 브라우저에서 API를 직접 호출하므로 입력한 키가 개발자 도구에서 노출될 수 있어요.
          실제 서비스에는 사용하지 마세요.
        </p>
      </section>

      <section
        class="chat-messages"
        id="chatMessages"
        aria-label="대화 내용"
        aria-live="polite"
      >
        <div class="message bot">
          안녕하세요! 배움도우미예요. 무엇을 도와드릴까요?
        </div>
      </section>

      <form class="chat-form" id="chatForm">
        <label for="chatInput" class="visually-hidden">메시지 입력</label>
        <input
          class="chat-input"
          id="chatInput"
          type="text"
          placeholder="메시지를 입력해 주세요"
          autocomplete="off"
          required
        >
        <button class="send-button" id="sendButton" type="submit">보내기</button>
      </form>
    </main>
  </div>

  <script>
    const faqList = [
      {
        question: "어떤 직업훈련과정이 있나요?",
        answer: "발달장애인 제조기술·사무행정, AI사무기술, 디자인, 전자전기, 경영회계, 기계, 기업 연계 맞춤훈련, 디지털훈련 과정이 있습니다. 개설 과정은 시기에 따라 달라질 수 있으니 최신 모집 안내를 확인해 주세요."
      },
      {
        question: "발달장애인을 위한 과정도 있나요?",
        answer: "네, 발달장애인을 위한 제조기술과 사무행정 과정이 있습니다. 과정 내용과 모집 여부는 기관에 확인해 주세요."
      },
      {
        question: "발달장애인 과정은 얼마나 훈련하나요?",
        answer: "발달장애인 과정은 6개월입니다. 정확한 시작일과 수업 일정은 모집 안내를 확인해 주세요."
      },
      {
        question: "디지털훈련은 얼마나 걸리나요?",
        answer: "디지털훈련은 3개월 또는 6개월 과정입니다. 모집 과정별 훈련기간은 기관에 확인해 주세요."
      },
      {
        question: "다른 과정은 얼마나 훈련하나요?",
        answer: "발달장애인 과정과 디지털훈련을 제외한 다른 과정은 12개월입니다. 정확한 일정은 과정별 모집 안내를 확인해 주세요."
      },
      {
        question: "누가 입학을 신청할 수 있나요?",
        answer: "장애인, 국가유공자, 근로복지공단의 위탁 의뢰를 받은 분 등이 신청할 수 있습니다. 과정마다 자격이나 조건이 다를 수 있으니 지원 전에 기관에 확인해 주세요."
      },
      {
        question: "입학하려면 어떻게 신청하나요?",
        answer: "신청 방법과 선발 절차는 과정별 모집 안내를 확인해 주세요. 안내를 찾기 어렵다면 기관에 문의해 주세요."
      },
      {
        question: "다음 과정은 언제 시작하나요?",
        answer: "과정별 시작일은 모집 시기에 따라 달라질 수 있습니다. 최신 모집 안내나 기관 문의처에서 확인해 주세요."
      },
      {
        question: "수강료와 숙식 비용이 있나요? 훈련참여수당도 받을 수 있나요?",
        answer: "수강료와 숙식은 무료로 제공하며, 훈련참여수당도 지급합니다. 장애인취업성공패키지 2026년 2단계(훈련참여) 참여자는 한 달 최대 284,000원, 미참여자는 한 달 최대 200,000원입니다. 기숙사를 이용하지 않고 통학하는 분은 한 달 최대 50,000원을 받을 수 있으며, 자세한 지급 조건은 기관에 확인해 주세요."
      },
      {
        question: "장애에 맞는 지원이나 편의를 받을 수 있나요?",
        answer: "지원 가능한 내용은 개인의 필요와 과정에 따라 다를 수 있습니다. 필요한 지원이 있다면 신청 전에 기관에 문의해 주세요."
      },
      {
        question: "훈련하면 자격증을 딸 수 있나요?",
        answer: "훈련을 통해 자격증 취득에 필요한 직업능력을 기를 수 있습니다. 취득할 수 있는 자격증과 시험 준비 내용은 과정별 안내를 확인해 주세요."
      },
      {
        question: "훈련을 마치면 취업을 지원해 주나요?",
        answer: "네, 훈련으로 직업능력을 기르고 취업을 지원합니다. 지원 내용과 범위는 과정별 안내를 확인해 주세요."
      },
      {
        question: "기업 연계 맞춤훈련은 무엇인가요?",
        answer: "기업의 필요에 맞춰 진행하는 훈련과정입니다. 참여 기업, 훈련 내용, 신청 방법은 모집 안내에서 확인해 주세요."
      },
      {
        question: "어떤 과정이 나에게 맞는지 모르겠어요.",
        answer: "관심 있는 직무와 배우고 싶은 내용을 생각해 보시면 과정 선택에 도움이 됩니다. 고민된다면 기관에 상담을 요청해 주세요."
      },
      {
        question: "자세한 내용은 어디에 물어보면 되나요?",
        answer: "과정별 모집 안내를 먼저 확인해 주세요. 안내에 필요한 정보가 없다면 기관의 공식 문의처로 연락해 주세요."
      }
    ];

    const systemRules = `
너의 이름은 배움도우미야. 장애인 직업훈련기관의 입학 희망자와 훈련생에게 학교 이용 안내와 학습 도움을 제공해.

[말투와 답변]
- 항상 존댓말을 사용하고 쉬운 말로 친절하게 답해.
- 답변은 3문장 이내로 작성해.
- 사용자를 존중하고 비난하지 마.

[FAQ와 정확성]
- 제공된 FAQ를 우선 참고해.
- FAQ에 답이 없으면 추측하거나 지어내지 말고 다음 문구로 답해:
  "죄송해요. 제가 가진 안내 자료에서는 답을 찾지 못했어요. 정확한 내용은 학교에 문의해 주세요."
- FAQ에 없는 내용을 사실처럼 말하지 마.

[개인정보]
- 주민등록번호, 전화번호, 집 주소 등 개인정보를 요청하지 마.
- 사용자가 개인정보를 입력해도 답변에 그대로 반복하거나 더 묻지 마.
- 개인정보를 채팅에 입력하지 않도록 안내해.

[건강과 위험 상황]
- 건강·의료 질문에 병명, 약, 치료 방법을 안내하거나 진단하지 마.
- 사용자가 아프거나 다쳤다고 하면 선생님이나 보호자에게 바로 알리도록 안내해. 응급 상황이면 119에 연락하도록 안내해.
- 사용자가 죽고 싶다거나 자신 또는 다른 사람을 해칠 수 있다고 말하면 믿을 수 있는 선생님이나 보호자에게 바로 알리고 혼자 있지 않도록 안내해.
- 당장 위험하면 112 또는 119에 연락하도록 안내해. 자살예방 상담전화 109도 안내할 수 있어.

[그 밖의 상황]
- 욕설에는 차분히 서로 존중하는 말을 사용해 달라고 요청해.
- 괴롭힘이나 안전 문제가 있으면 담당 선생님 또는 학교 상담 담당자에게 알리도록 안내해.
- 시험 정답만 요구하면 정답만 주지 말고, 이해를 돕는 힌트나 풀이 방법을 안내해.
- 다른 기관에 관한 질문은 해당 기관의 공식 홈페이지나 문의처에서 확인하도록 안내해.
- 학교 운영시간은 09:00~18:00이야. 운영시간 밖에는 운영시간을 알리고 운영시간에 다시 문의하도록 안내해.
`;

    const faqText = faqList
      .map((faq, index) => `${index + 1}. 질문: ${faq.question}\n답변: ${faq.answer}`)
      .join("\n\n");

    const conversationHistory = [];

    const openChatButton = document.getElementById("openChatButton");
    const closeChatButton = document.getElementById("closeChatButton");
    const chatOverlay = document.getElementById("chatOverlay");
    const chatForm = document.getElementById("chatForm");
    const chatInput = document.getElementById("chatInput");
    const apiKeyInput = document.getElementById("apiKeyInput");
    const chatMessages = document.getElementById("chatMessages");
    const sendButton = document.getElementById("sendButton");

    const isEmbedded = new URLSearchParams(window.location.search).get("embed") === "1";

    if (isEmbedded) {
      document.body.classList.add("embed-mode");
    }

    function openChat() {
      chatOverlay.hidden = false;
      document.body.style.overflow = "hidden";
      chatInput.focus();
    }

    function closeChat() {
      chatOverlay.hidden = true;
      document.body.style.overflow = "";

      if (!isEmbedded) {
        openChatButton.focus();
      }
    }

    openChatButton.addEventListener("click", openChat);
    closeChatButton.addEventListener("click", closeChat);

    chatOverlay.addEventListener("click", function (event) {
      if (event.target === chatOverlay && !isEmbedded) {
        closeChat();
      }
    });

    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape" && !chatOverlay.hidden && !isEmbedded) {
        closeChat();
      }
    });

    function addMessage(text, sender) {
      const message = document.createElement("div");
      message.classList.add("message", sender);
      message.textContent = text;
      chatMessages.appendChild(message);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function getErrorMessage(status) {
      if (status === 401) {
        return "API 키를 확인해 주세요. 키가 틀렸거나 사용할 수 없는 키일 수 있어요.";
      }

      if (status === 402) {
        return "API 사용에 필요한 결제나 크레딧이 부족한 것 같아요. OpenRouter 계정의 사용 상태를 확인해 주세요.";
      }

      if (status === 404) {
        return "요청한 모델이나 주소를 찾지 못했어요. 모델 이름과 API 주소를 확인해 주세요.";
      }

      if (status === 429) {
        return "요청이 너무 많아요. 잠시 기다렸다가 다시 시도해 주세요.";
      }

      return `연결 중 문제가 생겼어요. 상태 코드 ${status}를 확인해 주세요.`;
    }

    chatForm.addEventListener("submit", async function (event) {
      event.preventDefault();

      const userMessage = chatInput.value.trim();
      const apiKey = apiKeyInput.value.trim();

      if (!userMessage) {
        return;
      }

      if (!apiKey) {
        addMessage("먼저 OpenRouter API 키를 입력해 주세요.", "bot");
        apiKeyInput.focus();
        return;
      }

      addMessage(userMessage, "user");
      chatInput.value = "";
      sendButton.disabled = true;
      sendButton.textContent = "답변 중…";

      const requestMessages = [
        {
          role: "system",
          content: systemRules
        },
        {
          role: "system",
          content: `아래는 기관 FAQ야. 답변할 때 우선 참고해.\n\n${faqText}`
        },
        ...conversationHistory,
        {
          role: "user",
          content: userMessage
        }
      ];

      try {
        const response = await fetch(
          "https://openrouter.ai/api/v1/chat/completions",
          {
            method: "POST",
            headers: {
              "Authorization": `Bearer ${apiKey}`,
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              model: "openai/gpt-6-luna",
              messages: requestMessages
            })
          }
        );

        if (!response.ok) {
          const errorMessage = getErrorMessage(response.status);
          console.error("OpenRouter API error:", response.status, errorMessage);
          addMessage(errorMessage, "bot");
          return;
        }

        const data = await response.json();
        const answer = data.choices?.[0]?.message?.content;

        if (typeof answer !== "string" || answer.trim() === "") {
          const error = new Error("Response did not contain answer text.");
          console.error("OpenRouter response error:", error, data);
          addMessage("답변을 가져오지 못했어요. 잠시 후 다시 시도해 주세요.", "bot");
          return;
        }

        addMessage(answer, "bot");

        conversationHistory.push(
          {
            role: "user",
            content: userMessage
          },
          {
            role: "assistant",
            content: answer
          }
        );
      } catch (error) {
        console.error("OpenRouter connection failed:", error);
        addMessage(
          "AI 서비스에 연결하지 못했어요. 인터넷 연결을 확인하고 잠시 후 다시 시도해 주세요.",
          "bot"
        );
      } finally {
        sendButton.disabled = false;
        sendButton.textContent = "보내기";
        chatInput.focus();
      }
    });

    if (isEmbedded) {
      openChat();
    }
  </script>
</body>
</html>
